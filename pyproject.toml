[project]
name = "voice-rag"
version = "0.1.0"
description = "Voice-enabled RAG over MSMARCO-XI with multi-strategy chunking, a tool harness, and guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "numpy>=2.0",
  "faiss-cpu>=1.8",
  "bm25s>=0.2",
  "pyarrow>=17",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vaani-ingest = "scripts.ingest:main"
vaani-bench = "scripts.bench:main"
vaani-serve = "scripts.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
