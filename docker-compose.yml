services:
  vaani:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      VAANI_INDEX_DIR: /app/vaani_index
      HF_HOME: /app/models
    volumes:
      - ./vaani_index:/app/vaani_index:ro
      - ./models:/app/models
    restart: unless-stopped
    mem_limit: 24g

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:-16.171.133.1.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vaani
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
